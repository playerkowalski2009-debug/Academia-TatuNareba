<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercícios | Biblioteca de Exercícios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold text-orange-500">TATU NAREBA</a>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" type="button"
                class="flex items-center gap-x-2 rounded-2xl border border-gray-200 bg-gray-100 px-4 py-2 text-sm font-semibold text-gray-700 transition-all hover:border-orange-500 hover:text-orange-500"
                aria-pressed="false" aria-label="Alternar modo escuro">
          <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
          <span id="theme-toggle-text" class="hidden sm:inline">Modo escuro</span>
        </button>
        <a href="perfil.html" class="text-sm font-semibold text-slate-600 hover:text-orange-500">Meu perfil</a>
        <a href="pagamento.html" class="text-sm font-semibold text-slate-600 hover:text-orange-500">Voltar ao pagamento</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-16">
    <div class="mb-8">
      <p class="text-orange-500 font-semibold uppercase tracking-[0.2em]">Área liberada</p>
      <h1 class="mt-3 text-4xl font-bold">Exercícios disponíveis para você</h1>
      <p class="mt-4 text-lg text-slate-600">Sua assinatura está ativa. Explore os exercícios organizados por objetivo e nível de dificuldade.</p>
    </div>

    <div class="mb-8 rounded-3xl bg-white p-6 shadow">
      <div class="grid gap-4 md:grid-cols-[1.2fr_0.8fr]">
        <div>
          <label for="exercise-search" class="mb-2 block text-sm font-semibold text-slate-700">Pesquisar exercício</label>
          <input id="exercise-search" type="text" placeholder="Busque por nome ou parte do corpo" class="w-full rounded-2xl border border-slate-300 px-4 py-3" />
        </div>
        <div>
          <label for="exercise-filter" class="mb-2 block text-sm font-semibold text-slate-700">Filtrar por parte</label>
          <select id="exercise-filter" class="w-full rounded-2xl border border-slate-300 px-4 py-3 bg-white">
            <option value="Todos">Todos</option>
            <option value="Superior">Superior</option>
            <option value="Inferior">Inferior</option>
            <option value="Core">Core</option>
          </select>
        </div>
      </div>
      <p id="exercise-count" class="mt-4 text-sm font-medium text-slate-500">0 exercícios</p>
    </div>

    <div id="exercise-list" class="grid md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
  </main>

  <script src="../js/script (1).js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/exercicios.js"></script>
</body>
</html>
